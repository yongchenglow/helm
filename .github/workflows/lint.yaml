name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome linting
        run: bun run lint

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      # Resolves the upstream subchart pinned in each Chart.yaml, so a Renovate
      # version bump that does not exist upstream fails here rather than at
      # deploy time.
      - name: Update Helm dependencies
        run: bun run helm:deps

      - name: Run Helm linting
        run: bun run helm:lint

      # helm lint does not fail on templates that error only once rendered, so
      # render each chart as well.
      - name: Render charts
        run: bun run helm:template
